name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-y-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Dependencias de los productores: sin ellas los tests de contrato
          # que importan producer_* se saltarían en silencio.
          pip install -r backend/producers/requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests
        run: pytest tests -v

      - name: Validar docker-compose
        run: |
          cp backend/env/.env.example backend/env/.env
          # `docker/hadoop/` está registrado como gitlink y llega vacío al
          # checkout, así que `env_file: ./docker/hadoop/config` no resuelve.
          # La validación se salta hasta que ese directorio esté presente.
          if [ -f docker/hadoop/config ]; then
            docker compose config -q
          else
            echo "docker/hadoop/config ausente (submódulo vacío): se omite la validación"
          fi
